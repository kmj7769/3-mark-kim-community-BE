name: Backend App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 17, 21, 24, 25 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: ${{ matrix.java-version }}
      - name: Run tests
        run: ./gradlew test
